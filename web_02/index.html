<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Crear cuenta</h2>

  <input id="nombre" type="text" placeholder="Nombre" required>
  <input id="apellido" type="text" placeholder="Apellido" required>
  <input id="telefono" type="text" placeholder="Teléfono">

  <input id="email" type="email" placeholder="Correo" required>
  <input id="password" type="password" placeholder="Contraseña" required>

  <button onclick="registrar()">Registrar</button>

  <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabaseUrl = "https://trqxfchmwdkotimvobmd.supabase.co";
  const supabaseKey = "AIzaSyDtb2Y...CortaTuKeyAqui";
  const supabase = createClient(supabaseUrl, supabaseKey);

  const form = document.getElementById("loginForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
      alert("Llena todos los campos");
      return;
    }

    // Guardar en Supabase
    const { data, error } = await supabase.from("usuarios").insert([
      {
        username: username,
        password: password,
      },
    ]);

    if (error) {
      console.error("Error en Supabase:", error);
      alert("No se pudo registrar: " + error.message);
      return;
    }

    alert("Usuario registrado correctamente");
    form.reset();
  });
</script>


</body>
</html>
