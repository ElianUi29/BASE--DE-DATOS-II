  <div id="visorContenedor" class="visor-contenedor" style="display:none;">
    <h3>👀 Vista previa del archivo</h3>
    <iframe id="visorArchivo" width="80%" height="500px"></iframe>
    <br>
    <button class="btn cerrar" onclick="cerrarVisor()">Cerrar vista</button>
  </div>

  <script>
    function verArchivo(ruta) {
      const visor = document.getElementById('visorArchivo');
      const contenedor = document.getElementById('visorContenedor');
      visor.src = ruta;
      contenedor.style.display = 'block';
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function cerrarVisor() {
      document.getElementById('visorContenedor').style.display = 'none';
      document.getElementById('visorArchivo').src = "";
    }
  </script>
